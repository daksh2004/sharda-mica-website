name: Purge expired enquiries

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purge-expired-enquiries
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Check database secret is configured
        id: database_config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Skipping purge because DATABASE_URL is not configured. Add it as a repository secret (preferred) or variable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.database_config.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Delete enquiries older than 30 days
        if: steps.database_config.outputs.skip != 'true'
        run: pnpm run enquiries:purge -- --apply
